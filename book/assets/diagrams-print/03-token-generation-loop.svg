<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Jak LLM generuje odpověď</title><desc id="desc">Odpověď vzniká opakovaným odhadem dalšího tokenu.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Jak LLM generuje odpověď</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">Odpověď vzniká opakovaným odhadem dalšího tokenu.</text><rect x="65.0" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="161.6" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Prompt</text><text x="161.6" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">dosavadní kontext</text><line x1="262.2" y1="257.5" x2="280.2" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="284.2" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="380.79999999999995" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Transformer</text><text x="380.79999999999995" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">výpočet</text><line x1="481.4" y1="257.5" x2="499.4" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="503.4" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="600.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Pravděpodobnosti</text><text x="600.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">kandidátní tokeny</text><line x1="700.5999999999999" y1="257.5" x2="718.5999999999999" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="722.5999999999999" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2"/><text x="819.1999999999999" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Sampling</text><text x="819.1999999999999" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">výběr tokenu</text><line x1="919.8" y1="257.5" x2="937.8" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="941.8" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="1038.3999999999999" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Nový kontext</text><text x="1038.3999999999999" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">prompt + token</text><text x="600.0" y="505" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#374151">Smyčka pokračuje do konce odpovědi nebo limitu.</text></svg>