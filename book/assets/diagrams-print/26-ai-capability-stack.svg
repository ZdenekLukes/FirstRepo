<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="722" viewBox="0 0 1200 722" role="img" aria-labelledby="title desc"><title id="title">„Máme ChatGPT“ není AI capability</title><desc id="desc">Firemní hodnota vzniká propojením modelu s procesy, daty, nástroji a lidmi.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="722" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">„Máme ChatGPT“ není AI capability</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#374151">Firemní hodnota vzniká propojením modelu s procesy, daty, nástroji a lidmi.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Business proces</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">co chceme zlepšit</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Workflow / agent</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">řízení kroků</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Tools + integrations</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">API a aplikace</text><rect x="170" y="373" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2"/><text x="196" y="401" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Knowledge + data</text><text x="196" y="424" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">správný kontext</text><rect x="170" y="449" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="477" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Model layer</text><text x="196" y="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">cloud / local / routing</text><rect x="170" y="525" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="196" y="553" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Governance + evals</text><text x="196" y="576" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">bezpečnost a kvalita</text><rect x="170" y="601" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="196" y="629" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#111827">Lidé</text><text x="196" y="652" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">kompetence a ownership</text></svg>