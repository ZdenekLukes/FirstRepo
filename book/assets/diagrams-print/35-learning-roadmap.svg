<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Roadmapa učení: od modelu k produkci</title><desc id="desc">Další kroky dávají smysl v pořadí, ve kterém na sebe navazují.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Roadmapa učení: od modelu k produkci</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#374151">Další kroky dávají smysl v pořadí, ve kterém na sebe navazují.</text><rect x="65.0" y="185" width="156.66666666666666" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="143.33333333333331" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#111827">Local stack</text><text x="143.33333333333331" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">model + runtime</text><line x1="225.66666666666666" y1="257.5" x2="243.66666666666666" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="247.66666666666666" y="185" width="156.66666666666666" height="145" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="326.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#111827">RAG</text><text x="326.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">vlastní data</text><line x1="408.3333333333333" y1="257.5" x2="426.3333333333333" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="430.33333