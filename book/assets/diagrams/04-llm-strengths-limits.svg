<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="646" viewBox="0 0 1200 646" role="img" aria-labelledby="title desc"><title id="title">Kde je LLM silný — a kde potřebuje oporu</title><desc id="desc">Jazykový model je výborný interpret a generátor; přesnost často dodává externí nástroj.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="646" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Kde je LLM silný — a kde potřebuje oporu</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Jazykový model je výborný interpret a generátor; přesnost často dodává externí nástroj.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Silná stránka: transformace</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">shrnutí, přepis, překlad, strukturování</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Silná stránka: extrakce</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">hledání a třídění informací v dodaném kontextu</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Silná stránka: tvorba</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">text, kód, návrhy a varianty řešení</text><rect x="170" y="373" width="860" height="66" rx="15" fill="#111c30" stroke="#ffca6a" stroke-width="2"/><text x="196" y="401" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Ověřovat: fakta a reasoning</text><text x="196" y="424" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">sebevědomý výstup nemusí být správný</text><rect x="170" y="449" width="860" height="66" rx="15" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="196" y="477" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Připojit nástroj: aktuální svět</text><text x="196" y="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">web, databáze, API a firemní systémy</text><rect x="170" y="525" width="860" height="66" rx="15" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="196" y="553" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Připojit nástroj: přesnost</text><text x="196" y="576" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">kalkulačka, Python, testy, simulátor</text></svg>