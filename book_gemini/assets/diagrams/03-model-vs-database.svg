<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">LLM není databáze odpovědí</title><desc id="desc">Trénink mění parametry; přesné dokumenty musí dodat search, RAG nebo nástroj.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="560" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">LLM není databáze odpovědí</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Trénink mění parametry; přesné dokumenty musí dodat search, RAG nebo nástroj.</text><rect x="65.0" y="185" width="248.0" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="189.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Trénovací data</text><text x="189.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">texty a kód</text><line x1="317.0" y1="257.5" x2="335.0" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="339.0" y="185" width="248.0" height="145" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="463.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Učení</text><text x="463.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">vztahy a vzory</text><line x1="591.0" y1="257.5" x2="609.0" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="613.0" y="185" width="248.0" height="145" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="737.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Parametry</text><text x="737.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">komprimovaná reprezentace</text><line x1="865.0" y1="257.5" x2="883.0" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="887.0" y="185" width="248.0" height="145" rx="18" fill="#111c30" stroke="#ffca6a" stroke-width="2"/><text x="1011.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">LLM</text><text x="1011.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">generuje další token</text></svg>