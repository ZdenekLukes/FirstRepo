<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Kam se AI posouvá: od modelu k ověřenému systému</title><desc id="desc">Pět trendů: adaptivní reasoning, multimodalita, levnější inference, nástroje a agentní workflow, vše směřuje k ověřenému AI systému.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="620" rx="28" fill="#0b1220"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Kam se AI posouvá</text><text x="60" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Ne jeden „chytřejší model“, ale systém s více compute, modalitami, nástroji a verifikací.</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="60" y="170" width="190" height="120" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="155" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#eef6ff">Reasoning</text><text x="155" y="242" text-anchor="middle" font-size="16" fill="#a9bbcf">adaptivní compute</text><rect x="285" y="170" width="190" height="120" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="380" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#eef6ff">Multimodalita</text><text x="380" y="242" text-anchor="middle" font-size="16" fill="#a9bbcf">text · obraz · audio</text><rect x="510" y="170" width="190" height="120" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="605" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#eef6ff">Efektivita</text><text x="605" y="242" text-anchor="middle" font-size="16" fill="#a9bbcf">nižší cost / task</text><rect x="735" y="170" width="190" height="120" rx="18" fill="#111c30" stroke="#ffca6a" stroke-width="2"/><text x="830" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#eef6ff">Tools</text><text x="830" y="242" text-anchor="middle" font-size="16" fill="#a9bbcf">data + akce</text><rect x="960" y="170" width="180" height="120" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="1050" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#eef6ff">Agents</text><text x="1050" y="242" text-anchor="middle" font-size="16" fill="#a9bbcf">delší workflow</text><line x1="155" y1="310" x2="570" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="380" y1="310" x2="585" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="605" y1="310" x2="605" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="830" y1="310" x2="625" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="1050" y1="310" x2="640" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="410" width="510" height="135" rx="22" fill="#111c30" stroke="#63d7a5" stroke-width="3"/><text x="605" y="458" text-anchor="middle" font-size="27" font-weight="700" fill="#eef6ff">OVĚŘENÝ AI SYSTÉM</text><text x="605" y="494" text-anchor="middle" font-size="18" fill="#a9bbcf">context + tools + policy + evals + observability</text><text x="605" y="524" text-anchor="middle" font-size="18" fill="#a9bbcf">schopnost ≠ spolehlivost</text></g></svg>