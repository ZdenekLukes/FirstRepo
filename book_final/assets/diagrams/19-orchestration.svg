<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Orchestrace agentních systémů</title><desc id="desc">Workflow drží stav, retry a checkpointy; LLM rozhoduje jen tam, kde přidává hodnotu.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="560" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Orchestrace agentních systémů</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Workflow drží stav, retry a checkpointy; LLM rozhoduje jen tam, kde přidává hodnotu.</text><rect x="65.0" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="161.6" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Input</text><text x="161.6" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">event / request</text><line x1="262.2" y1="257.5" x2="280.2" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="284.2" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="380.79999999999995" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">State</text><text x="380.79999999999995" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">checkpoint</text><line x1="481.4" y1="257.5" x2="499.4" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="503.4" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="600.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Agent step</text><text x="600.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">LLM + tools</text><line x1="700.5999999999999" y1="257.5" x2="718.5999999999999" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="722.5999999999999" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#ffca6a" stroke-width="2"/><text x="819.1999999999999" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Control</text><text x="819.1999999999999" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">retry / timeout</text><line x1="919.8" y1="257.5" x2="937.8" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="941.8" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="1038.3999999999999" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Output</text><text x="1038.3999999999999" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">result</text></svg>