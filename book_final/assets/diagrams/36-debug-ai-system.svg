<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Když AI selže, kde hledat chybu</title><desc id="desc">Nehledám automaticky „lepší model“. Nejprve lokalizuji vrstvu, která selhala.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60758b" /></marker></defs><rect width="1200" height="700" rx="30" fill="#0b1220" /><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Když AI selže, kde hledat chybu</text><text x="60" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#b5c6d8">Nehledám automaticky „lepší model“. Nejprve lokalizuji vrstvu, která selhala.</text><line x1="190" y1="295" x2="205" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><line x1="354" y1="295" x2="369" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><line x1="518" y1="295" x2="533" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><line x1="682" y1="295" x2="697" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><line x1="846" y1="295" x2="861" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><line x1="1010" y1="295" x2="1025" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)" /><rect x="45" y="220" width="145" height="150" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2.5" /><text x="117.5" y="267.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef6ff">1 · DATA</text><text x="117.5" y="296.6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8"><tspan x="117.5" dy="0">správný</tspan><tspan x="117.5" dy="20.7">zdroj</tspan></text><text x="117.5" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial