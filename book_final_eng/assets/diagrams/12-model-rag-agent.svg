<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Model vs. RAG vs. Agent</title><desc id="desc">These are not three competing things. Each additional layer adds a new system capability.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188" /></marker></defs><rect width="1200" height="560" rx="28" fill="#0b1220" /><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Model vs. RAG vs. Agent</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">These are not three competing things. Each additional layer adds a new system capability.</text><rect x="65.0" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2" /><text x="161.6" y="247.2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Model</text><text x="161.6" y="273.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf"><tspan x="161.6" dy="0">generates and</tspan><tspan x="161.6" dy="17.2">interprets</tspan></text><line x1="262.2" y1="257.5" x2="280.2" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)" /><rect x="284.2" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2" /><text x="380.8" y="247.2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">+ RAG</text><text x="380.8" y="273.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf"><tspan x="380.8" dy="0">retrieves private</tspan><tspan x="380.8" dy="17.2">knowledge</tspan></text><line x1="481.4" y1="257.5" x2="499.4" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)" /><rect x="503.4" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2" /><text x="600.0" y="255.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">+ Tools</text><text x="600.0" y="281.9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">can perform an action</text><line x1="700.5999999999999" y1="257.5" x2="718.5999999999999" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)" /><rect x="722.5999999999999" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#ffca6a" stroke-width="2" /><text x="819.2" y="255.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">+ Agent loop</text><text x="819.2" y="281.9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">chooses the next step</text><line x1="919.8" y1="257.5" x2="937.8" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)" /><rect x="941.8" y="185" width="193.2" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2" /><text x="1038.4" y="247.2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">AI system</text><text x="1038.4" y="273.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf"><tspan x="1038.4" dy="0">data + tools +</tspan><tspan x="1038.4" dy="17.2">controls</tspan></text></svg>