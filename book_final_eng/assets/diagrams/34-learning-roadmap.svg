<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Learning Roadmap: From Model to Production</title><desc id="desc">The next steps make sense in the order in which they build on one another.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="560" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Learning Roadmap: From Model to Production</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">The next steps make sense in the order in which they build on one another.</text><rect x="65.0" y="185" width="156.66666666666666" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="143.33333333333331" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Local stack</text><text x="143.33333333333331" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">model + runtime</text><line x1="225.66666666666666" y1="257.5" x2="243.66666666666666" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="247.66666666666666" y="185" width="156.66666666666666" height="145" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="326.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">RAG</text><text x="326.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">your own data</text><line x1="408.3333333333333" y1="257.5" x2="426.3333333333333" y2="257.5" stroke="#5e7188" stroke-width="3" marker-