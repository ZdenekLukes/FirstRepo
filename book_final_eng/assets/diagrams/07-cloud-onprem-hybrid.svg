<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Cloud vs. on-prem vs. hybrid</title><desc id="desc">Route the task by data sensitivity, performance, cost, and operational risk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="560" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Cloud vs. on-prem vs. hybrid</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Route the task by data sensitivity, performance, cost, and operational risk.</text><rect x="65.0" y="185" width="339.3333333333333" height="145" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="234.66666666666666" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Cloud</text><text x="234.66666666666666" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">frontier models</text><text x="234.66666666666666" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">rapid scaling</text><line x1="408.3333333333333" y1="257.5" x2="426.3333333333333" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="430.3333333333333" y="185" width="339.3333333333333" height="145" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="600.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">Hybrid</text><text x="600.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">sensitive data local</text><text x="600.0" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">selective cloud</text><line x1="773.6666666666666" y1="257.5" x2="791.6666666666666" y2="257.5" stroke="#5e7188" stroke-width="3" marker-end="url(#arrow)"/><rect x="795.6666666666666" y="185" width="339.3333333333333" height="145" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="965.3333333333333" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#eef6ff">On-prem</text><text x="965.3333333333333" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">data control</text><text x="965.3333333333333" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9bbcf">self-operated</text></svg>