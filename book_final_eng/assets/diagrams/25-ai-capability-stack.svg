<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="722" viewBox="0 0 1200 722" role="img" aria-labelledby="title desc"><title id="title">“We Have ChatGPT” Is Not an AI Capability</title><desc id="desc">Business value comes from connecting the model to processes, data, tools, and people.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="722" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">“We Have ChatGPT” Is Not an AI Capability</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Business value comes from connecting the model to processes, data, tools, and people.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Business proces</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">what we want to improve</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Workflow / agent</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">step control</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Tools + integrations</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">APIs and applications</text><rect x="170" y="373" width="860" height="66" rx="15" fill="#111c30" stroke="#ffca6a" stroke-width="2"/><text x="196" y="401" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Knowledge + data</text><text x="196" y="424" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">right context</text><rect x="170" y="449" width="860" height="66" rx="15" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="196" y="477" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Model layer</text><text x="196" y="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">cloud / local / routing</text><rect x="170" y="525" width="860" height="66" rx="15" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="196" y="553" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Governance + evals</text><text x="196" y="576" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">security and quality</text><rect x="170" y="601" width="860" height="66" rx="15" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="196" y="629" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">People</text><text x="196" y="652" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">skills and ownership</text></svg>