<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="646" viewBox="0 0 1200 646" role="img" aria-labelledby="title desc"><title id="title">TCO AI řešení</title><desc id="desc">Cena tokenů nebo GPU je jen jedna vrstva celkových nákladů.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="646" rx="28" fill="#0b1220"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">TCO AI řešení</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bbcf">Cena tokenů nebo GPU je jen jedna vrstva celkových nákladů.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#111c30" stroke="#45c7ff" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Cena chyby</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">dopad špatného výsledku</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#111c30" stroke="#8b7cff" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Lidé a provoz</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">monitoring a support</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#111c30" stroke="#63d7a5" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#eef6ff">Integrace</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9bbcf">vývoj a ú