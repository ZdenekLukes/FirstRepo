<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Od modelu k systému</title><desc id="desc">Nejdůležitější změna pohledu není větší model, ale lepší otázky kolem něj.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60758b"/></marker></defs><rect width="1200" height="700" rx="30" fill="#0b1220"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#eef6ff">Od modelu k systému</text><text x="60" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#b5c6d8">Nejdůležitější změna pohledu není větší model, ale lepší otázky kolem něj.</text><line x1="380" y1="290" x2="440" y2="290" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="760" y1="290" x2="820" y2="290" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="390" x2="600" y2="445" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="205" width="300" height="170" rx="18" fill="#111c30" stroke="#ff8e7a" stroke-width="2.5"/><text x="220.0" y="243" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef6ff">MODEL-CENTRIC</text><text x="220.0" y="277" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Který model je nejlepší?</text><text x="220.0" y="304" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Kolik má parametrů?</text><text x="220.0" y="331" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Kdo vede benchmark?</text><rect x="450" y="205" width="300" height="170" rx="18" fill="#111c30" stroke="#63d7a5" stroke-width="2.5"/><text x="600.0" y="243" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef6ff">SYSTEM-CENTRIC</text><text x="600.0" y="277" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Jaká data vidí?</text><text x="600.0" y="304" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Jaké má nástroje?</text><text x="600.0" y="331" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Jak výsledek ověřím?</text><rect x="830" y="205" width="300" height="170" rx="18" fill="#111c30" stroke="#45c7ff" stroke-width="2.5"/><text x="980.0" y="243" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef6ff">VALUE-CENTRIC</text><text x="980.0" y="277" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Je výsledek správný?</text><text x="980.0" y="304" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Je bezpečný?</text><text x="980.0" y="331" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">Je lepší než baseline?</text><rect x="350" y="455" width="500" height="115" rx="18" fill="#111c30" stroke="#8b7cff" stroke-width="2.5"/><text x="600.0" y="493" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef6ff">POSUN</text><text x="600.0" y="527" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b5c6d8">model → systém → měřitelný výsledek</text><text x="600" y="660" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef6ff">Schopnost modelu je vstup. Hodnota je vlastnost celého workflow.</text></svg>