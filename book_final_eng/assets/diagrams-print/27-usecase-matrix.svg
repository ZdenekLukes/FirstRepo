<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Choosing an AI Use Case</title><desc id="desc">Prefer high value with reasonable technical and operational complexity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280" /></marker></defs><rect width="1200" height="650" rx="28" fill="#ffffff" /><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Choosing an AI Use Case</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">Prefer high value with reasonable technical and operational complexity.</text><line x1="230" y1="510" x2="1030" y2="510" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><line x1="230" y1="510" x2="230" y2="160" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><line x1="630.0" y1="160" x2="630.0" y2="510" stroke="#6b7280" stroke-dasharray="8 8" /><line x1="230" y1="335.0" x2="1030" y2="335.0" stroke="#6b7280" stroke-dasharray="8 8" /><text x="230" y="550" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#374151">lower complexity</text><text x="1030" y="550" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#374151">higher complexity</text><text x="212" y="510" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#374151">lower value</text><text x="212" y="170" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#374151">higher value</text><rect x="680" y="365" width="300" height="110" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2" /><text x="830.0" y="406.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Strategic bet</text><text x="830.0" y="442.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="830.0" dy="0">high value, high</tspan><tspan x="830.0" dy="28.7">complexity</tspan></text><rect x="280" y="365" width="300" height="110" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2" /><text x="430.0" y="406.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Low priority</text><text x="430.0" y="442.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="430.0" dy="0">low value and low</tspan><tspan x="430.0" dy="28.7">complexity</tspan></text><rect x="280" y="190" width="300" height="110" rx="18" fill="#f5f7fa" stroke="#16805d" stroke-width="2" /><text x="430.0" y="231.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Quick win</text><text x="430.0" y="267.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="430.0" dy="0">high value, low</tspan><tspan x="430.0" dy="28.7">complexity</tspan></text><rect x="680" y="190" width="300" height="110" rx="18" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2" /><text x="830.0" y="231.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Watch out</text><text x="830.0" y="267.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="830.0" dy="0">complex, but low</tspan><tspan x="830.0" dy="28.7">benefit</tspan></text></svg>