<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Cloud vs. on-prem vs. hybrid</title><desc id="desc">Route the task by data sensitivity, performance, cost, and operational risk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="560" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Cloud vs. on-prem vs. hybrid</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">Route the task by data sensitivity, performance, cost, and operational risk.</text><rect x="65.0" y="185" width="339.3333333333333" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="234.66666666666666" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Cloud</text><text x="234.66666666666666" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">frontier modely</text><text x="234.66666666666666" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">rapid scaling</text><line x1="408.3333333333333" y1="257.5" x2="426.3333333333333" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="430.3333333333333" y="185" width="339.3333333333333" height="145" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="600.0" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Hybrid</text><text x="600.0" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">sensitive data local</text><text x="600.0" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">selective cloud</text><line x1="773.6666666666666" y1="257.5" x2="791.6666666666666" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="795.6666666666666" y="185" width="339.3333333333333" height="145" rx="18" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="965.3333333333333" y="221" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">On-prem</text><text x="965.3333333333333" y="251" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">kontrola dat</text><text x="965.3333333333333" y="273" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">self-operated</text></svg>