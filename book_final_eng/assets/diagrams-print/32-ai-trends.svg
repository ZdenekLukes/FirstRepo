<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Where AI Is Going: From Model to Verified System</title><desc id="desc">Five trends — adaptive reasoning, multimodality, cheaper inference, tools, and agentic workflows — converge on verified AI systems.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5e7188"/></marker></defs><rect width="1200" height="620" rx="28" fill="#ffffff"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#17202b">Where AI Is Going</text><text x="60" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#4d5c6d">Not one “smarter model,” but a system with more adaptive compute, modalities, tools, and verification.</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="60" y="170" width="190" height="120" rx="18" fill="#f5f7fa" stroke="#45c7ff" stroke-width="2"/><text x="155" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#17202b">Reasoning</text><text x="155" y="242" text-anchor="middle" font-size="20" fill="#4d5c6d">adaptive compute</text><rect x="285" y="170" width="190" height="120" rx="18" fill="#f5f7fa" stroke="#8b7cff" stroke-width="2"/><text x="380" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#17202b">Multimodalita</text><text x="380" y="242" text-anchor="middle" font-size="20" fill="#4d5c6d">text · obraz · audio</text><rect x="510" y="170" width="190" height="120" rx="18" fill="#f5f7fa" stroke="#63d7a5" stroke-width="2"/><text x="605" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#17202b">Efektivita</text><text x="605" y="242" text-anchor="middle" font-size="20" fill="#4d5c6d">lower cost / task</text><rect x="735" y="170" width="190" height="120" rx="18" fill="#f5f7fa" stroke="#ffca6a" stroke-width="2"/><text x="830" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#17202b">Tools</text><text x="830" y="242" text-anchor="middle" font-size="20" fill="#4d5c6d">data + akce</text><rect x="960" y="170" width="180" height="120" rx="18" fill="#f5f7fa" stroke="#45c7ff" stroke-width="2"/><text x="1050" y="210" text-anchor="middle" font-size="21" font-weight="700" fill="#17202b">Agents</text><text x="1050" y="242" text-anchor="middle" font-size="20" fill="#4d5c6d">longer workflows</text><line x1="155" y1="310" x2="570" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="380" y1="310" x2="585" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="605" y1="310" x2="605" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="830" y1="310" x2="625" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><line x1="1050" y1="310" x2="640" y2="405" stroke="#5e7188" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="410" width="510" height="135" rx="22" fill="#f5f7fa" stroke="#63d7a5" stroke-width="3"/><text x="605" y="458" text-anchor="middle" font-size="27" font-weight="700" fill="#17202b">VERIFIED AI SYSTEM</text><text x="605" y="494" text-anchor="middle" font-size="20" fill="#4d5c6d">context + tools + policy + evals + observability</text><text x="605" y="524" text-anchor="middle" font-size="20" fill="#4d5c6d">schopnost ≠ spolehlivost</text></g></svg>