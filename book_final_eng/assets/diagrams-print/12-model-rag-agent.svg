<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Model vs. RAG vs. Agent</title><desc id="desc">These are not three competing things. Each additional layer adds a new system capability.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280" /></marker></defs><rect width="1200" height="560" rx="28" fill="#ffffff" /><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Model vs. RAG vs. Agent</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">These are not three competing things. Each additional layer adds a new system capability.</text><rect x="65.0" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2" /><text x="161.6" y="226.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Model</text><text x="161.6" y="262.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="161.6" dy="0">generates</tspan><tspan x="161.6" dy="28.7">and</tspan><tspan x="161.6" dy="28.7">interprets</tspan></text><line x1="262.2" y1="257.5" x2="280.2" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="284.2" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2" /><text x="380.8" y="226.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">+ RAG</text><text x="380.8" y="262.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="380.8" dy="0">retrieves</tspan><tspan x="380.8" dy="28.7">private</tspan><tspan x="380.8" dy="28.7">knowledge</tspan></text><line x1="481.4" y1="257.5" x2="499.4" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="503.4" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#16805d" stroke-width="2" /><text x="600.0" y="237.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">+ Tools</text><text x="600.0" y="274.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="600.0" dy="0">can perform</tspan><tspan x="600.0" dy="28.7">an action</tspan></text><line x1="700.5999999999999" y1="257.5" x2="718.5999999999999" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="722.5999999999999" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2" /><text x="819.2" y="226.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827"><tspan x="819.2" dy="0">+ Agent</tspan><tspan x="819.2" dy="28.7">loop</tspan></text><text x="819.2" y="291.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="819.2" dy="0">chooses the</tspan><tspan x="819.2" dy="28.7">next step</tspan></text><line x1="919.8" y1="257.5" x2="937.8" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="941.8" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2" /><text x="1038.4" y="237.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">AI system</text><text x="1038.4" y="274.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="1038.4" dy="0">data + tools</tspan><tspan x="1038.4" dy="28.7">+ controls</tspan></text></svg>