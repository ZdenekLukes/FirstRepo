<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="646" viewBox="0 0 1200 646" role="img" aria-labelledby="title desc"><title id="title">AI Readiness Is Not Only Technology</title><desc id="desc">Process, data, security, measurement, and people must be ready together.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="646" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">AI Readiness Is Not Only Technology</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">Process, data, security, measurement, and people must be ready together.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Proces</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">clear process and owner</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Data</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">availability and quality</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Knowledge</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">what is documented</text><rect x="170" y="373" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2"/><text x="196" y="401" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Security</text><text x="196" y="424" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">sensitivity and permissions</text><rect x="170" y="449" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="477" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Measurement</text><text x="196" y="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">baseline and metrics</text><rect x="170" y="525" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="196" y="553" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">People</text><text x="196" y="576" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">users and accountability</text></svg>