<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">When AI Fails: Where to Look First</title><desc id="desc">Do not automatically reach for a “better model.” First locate the layer that failed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#60758b"/></marker></defs><rect width="1200" height="700" rx="30" fill="#ffffff"/><text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#17202b">When AI Fails: Where to Look First</text><text x="60" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">Do not automatically reach for a “better model.” First locate the layer that failed.</text><line x1="190" y1="295" x2="205" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="354" y1="295" x2="369" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="518" y1="295" x2="533" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="682" y1="295" x2="697" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="846" y1="295" x2="861" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><line x1="1010" y1="295" x2="1025" y2="295" stroke="#60758b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#63d7a5" stroke-width="2.5"/><text x="117.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">1 · DATA</text><text x="117.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">correct source</text><text x="117.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">revize</text><rect x="209" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#8b7cff" stroke-width="2.5"/><text x="281.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">2 · CONTEXT</text><text x="281.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">retrieval</text><text x="281.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">relevance</text><rect x="373" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#ffca6a" stroke-width="2.5"/><text x="445.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">3 · TOOLS</text><text x="445.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">arguments</text><text x="445.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">outputs</text><rect x="537" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#ff8e7a" stroke-width="2.5"/><text x="609.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">4 · POLICY</text><text x="609.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">permissions</text><text x="609.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">approval</text><rect x="701" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#45c7ff" stroke-width="2.5"/><text x="773.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">5 · STATE</text><text x="773.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">loop</text><text x="773.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">checkpoint</text><rect x="865" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#63d7a5" stroke-width="2.5"/><text x="937.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">6 · VERIFY</text><text x="937.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">tests</text><text x="937.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">evals</text><rect x="1029" y="220" width="145" height="150" rx="18" fill="#f6f8fa" stroke="#8b7cff" stroke-width="2.5"/><text x="1101.5" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202b">7 · MODEL</text><text x="1101.5" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">capability</text><text x="1101.5" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#445465">reasoning</text><text x="600" y="660" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17202b">The model is only one possible cause. Debug the system, not the brand.</text></svg>