<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Security Boundaries of an Agentic System</title><desc id="desc">Permissions and controls must separate untrusted data, the model, and tools.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280" /></marker></defs><rect width="1200" height="560" rx="28" fill="#ffffff" /><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Security Boundaries of an Agentic System</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">Permissions and controls must separate untrusted data, the model, and tools.</text><rect x="65.0" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2" /><text x="161.6" y="226.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827"><tspan x="161.6" dy="0">Untrusted</tspan><tspan x="161.6" dy="28.7">input</tspan></text><text x="161.6" y="291.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="161.6" dy="0">web/ mail/</tspan><tspan x="161.6" dy="28.7">docs</tspan></text><line x1="262.2" y1="257.5" x2="280.2" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="284.2" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2" /><text x="380.8" y="237.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827"><tspan x="380.8" dy="0">Policy</tspan><tspan x="380.8" dy="28.7">boundary</tspan></text><text x="380.8" y="302.9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">sanitization</text><line x1="481.4" y1="257.5" x2="499.4" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="503.4" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#16805d" stroke-width="2" /><text x="600.0" y="251.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">LLM / agent</text><text x="600.0" y="288.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">tool selection</text><line x1="700.5999999999999" y1="257.5" x2="718.5999999999999" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="722.5999999999999" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2" /><text x="819.2" y="236.9" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">Permissions</text><text x="819.2" y="273.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="819.2" dy="0">least</tspan><tspan x="819.2" dy="28.7">privilege</tspan></text><line x1="919.8" y1="257.5" x2="937.8" y2="257.5" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)" /><rect x="941.8" y="185" width="193.2" height="145" rx="18" fill="#f5f7fa" stroke="#0077a8" stroke-width="2" /><text x="1038.4" y="237.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Tool</text><text x="1038.4" y="274.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151"><tspan x="1038.4" dy="0">read/ write/</tspan><tspan x="1038.4" dy="28.7">external</tspan></text></svg>