<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">AI → ML → Deep Learning → Generative AI → LLM</title><desc id="desc">An LLM is a model type; an agentic system is a system built around a model.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs><rect width="1200" height="610" rx="28" fill="#ffffff"/><text x="60" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">AI → ML → Deep Learning → Generative AI → LLM</text><text x="60" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#374151">An LLM is a model type; an agentic system is a system built around a model.</text><rect x="170" y="145" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="173" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Artificial Intelligence</text><text x="196" y="196" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">broadest class of intelligent systems</text><rect x="170" y="221" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#5b4bc4" stroke-width="2"/><text x="196" y="249" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Machine Learning</text><text x="196" y="272" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">learning patterns from data</text><rect x="170" y="297" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#16805d" stroke-width="2"/><text x="196" y="325" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Deep Learning</text><text x="196" y="348" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">deep neural networks</text><rect x="170" y="373" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#8a5a00" stroke-width="2"/><text x="196" y="401" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Generative AI</text><text x="196" y="424" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">generation of new content</text><rect x="170" y="449" width="860" height="66" rx="15" fill="#f5f7fa" stroke="#0077a8" stroke-width="2"/><text x="196" y="477" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#111827">Foundation Models / LLM</text><text x="196" y="500" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#374151">general models adaptable to many tasks</text></svg>