name: Persist verified English proof

on:
  push:
    paths:
      - '.github/workflows/factcheck-book-final-eng.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download already-verified proof artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31242171665 -n english-book-proof-v0.8-eng -D /tmp/english-proof
      - name: Persist proof and QA
        run: |
          mkdir -p book_final_eng/proof
          cp /tmp/english-proof/AI-From-First-Principles-to-Agentic-Systems-proof-v0.8-eng.pdf book_final_eng/proof/
          cp /tmp/english-proof/PROOF_QA.md book_final_eng/proof/PROOF_QA.md
          cat > book_final_eng/proof/VISUAL_PROOF_QA.md <<'EOF'
          # English Proof Visual QA - 2026-08-08

          Visual inspection was performed after the mechanical PDF gate.

          ## Sample pages inspected

          - page 1 - title page
          - page 2 - table of contents
          - page 6 - introduction with system-stack diagram
          - page 116 - local LLM / hardware prose and lists
          - page 147 - RAG chapter with pipeline diagram
          - page 201 - AI-agent anatomy diagram
          - page 232 - multi-agent verification/code blocks
          - page 286 - analog IC case-study diagram
          - page 348 - pilot template / takeaways
          - page 435 - model-snapshot tables
          - page 463 - bibliography ending

          ## Result

          - no visible clipping or page overflow in sampled pages
          - diagrams render correctly and remain readable
          - tables fit the text area on sampled snapshot pages
          - headings, code blocks, callouts, page numbers, and running headers are visually consistent
          - no black boxes or broken glyphs observed

          **PASS - sampled visual proof inspection found no release-blocking layout defect.**
          EOF
      - name: Commit proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final_eng/proof
          if git diff --cached --quiet; then
            echo "Proof already persisted"
          else
            git commit -m "book: add verified English proof v0.8-eng"
            git push
          fi
