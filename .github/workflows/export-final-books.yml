name: Export final book sources

on:
  push:
    paths:
      - '.github/workflows/export-final-books.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Czech and English final books
        run: |
          mkdir -p editorial_export
          cp -a book_final editorial_export/
          cp -a book_final_eng editorial_export/
          rm -rf editorial_export/book_final/proof editorial_export/book_final_eng/proof
      - uses: actions/upload-artifact@v4
        with:
          name: final-books-editorial-export
          path: editorial_export/
          if-no-files-found: error
