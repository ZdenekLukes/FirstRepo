name: Compare three book versions

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/compare_three_book_versions.py'
      - '.github/workflows/compare-three-book-versions.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate comparison data
        run: python tools/compare_three_book_versions.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THREE_VERSION_COMPARISON_REPORT_2026-08-07.md
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "book: generate three-version comparison report"
            git push
          fi
