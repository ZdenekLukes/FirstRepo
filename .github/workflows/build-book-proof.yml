name: Build book proof PDF

on:
  push:
    paths:
      - '.github/workflows/build-book-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install --upgrade markdown weasyprint pymupdf pillow
      - name: Build proof
        run: python tools/build_book_proof.py
      - name: Audit proof
        run: python tools/audit_book_proof.py
      - name: Commit proof outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/proof
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add v0.4 typeset proof PDF and audit"
            git push
          fi
