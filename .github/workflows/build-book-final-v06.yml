name: Build final hybrid book v0.6

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_book_final_v06.py'
      - '.github/workflows/build-book-final-v06.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch and validate hybrid builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_book_final_v06.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if line.strip() == 'idx = 0':
                  line = line.replace('idx = 0', 'idx = [0]')
              elif line.strip() == 'nonlocal idx':
                  continue
              elif 'key = f"@@CHREF{idx}@@"; idx += 1; placeholders[key] = value; return key' in line:
                  line = line.replace('key = f"@@CHREF{idx}@@"; idx += 1; placeholders[key] = value; return key', 'key = f"@@CHREF{idx[0]}@@"; idx[0] += 1; placeholders[key] = value; return key')
              elif 'part = pm.group(1).strip(' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + "part = pm.group(1).strip().strip(\"\\\"'\") if pm else \"KNIHA\""
              elif 'return m.group(1) + "16-" if "agent-loop"' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + 'return m.group(1) + "16-" + m.group(3) if "agent-loop" in m.group(3) else m.group(0)'
              elif line.strip().startswith('linked = sorted(set(int(x)'):
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + "linked = sorted({int(x) for x in re.findall(r'\\[\\[(\\d{2}) - ', idx) if int(x) > 0})"
              out.append(line)
          s = '\n'.join(out) + '\n'
          s = s.replace('for marker in ("\\n## Co si z kapitoly odnést", "\\n# Co si z kapitoly odnést"):', 'for marker in ("\\n## Co si z kapitoly odnést", "\\n# Co si z kapitoly odnést", "\\n## Co si z kapitoly zapamatovat"):')
          s = s.replace('**„Claude Opus 5“ není k datu tohoto snapshotu správný veřejný název modelu.**', '**„Opus 5“ není k datu tohoto snapshotu správný veřejný název modelu.**')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/build_book_final_v06.py

      - name: Build hybrid source
        run: python tools/build_book_final_v06.py

      - name: Prepare isolated proof workspace
        run: |
          rm -rf /tmp/book_original_v06
          mv book /tmp/book_original_v06
          cp -a book_final book
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/prepress_audit.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("chapters=sorted([p for p in BOOK.glob('[0-9][0-9] - *.md') if p.name!='00 - INDEX.md'])", "chapters=sorted([p for p in BOOK.glob('[0-9][0-9] - *.md') if not p.name.startswith('00 -')])")
          s = s.replace("expected=list(range(1,38))", "expected=list(range(1,37))")
          s = s.replace("ch37=row_by.get('37 - Deset praktických projektů od začátečníka k agentnímu systému.md')", "ch37=row_by.get('36 - Deset praktických projektů od začátečníka k agentnímu systému.md')")
          s = s.replace('Kapitola 37 je stále příliš krátká', 'Kapitola 36 je stále příliš krátká')
          p.write_text(s, encoding='utf-8')
          PY
          for f in tools/build_book_proof.py tools/add_bibliography_to_proof.py tools/refine_book_proof.py tools/audit_book_proof.py tools/final_proof_qa.py tools/inspect_proof_small_fonts.py; do
            sed -i 's/v0\.4/v0.6/g' "$f"
          done

      - name: Install proof dependencies
        run: python -m pip install --upgrade markdown weasyprint pymupdf pillow

      - name: Final copyedit and source audits
        run: |
          python tools/final_copyedit_pass.py
          python tools/prepress_audit.py
          python tools/editorial_style_audit.py

      - name: Build and audit proof v0.6
        run: |
          python tools/build_book_proof.py
          python tools/add_bibliography_to_proof.py
          python tools/refine_book_proof.py
          python tools/audit_book_proof.py
          python tools/final_proof_qa.py
          python tools/inspect_proof_small_fonts.py

      - name: Restore original book and finalize book_final
        run: |
          rm -rf book_final
          cp -a book book_final
          rm -rf book
          mv /tmp/book_original_v06 book
          git checkout -- README.md tools/prepress_audit.py tools/build_book_proof.py tools/add_bibliography_to_proof.py tools/refine_book_proof.py tools/audit_book_proof.py tools/final_proof_qa.py tools/inspect_proof_small_fonts.py
          python tools/build_book_final_v06.py --audit-only

      - name: Commit final hybrid book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final
          if git diff --cached --quiet; then
            echo "No book_final changes"
          else
            git commit -m "book: create final hybrid v0.6"
            git push
          fi
