name: Add book visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-book-visuals.yml'
      - 'tools/add_book_visuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-insert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and insert visuals
        run: python tools/add_book_visuals.py

      - name: Commit generated visuals
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book
          git commit -m "Add visual diagrams across AI book"
          git push
