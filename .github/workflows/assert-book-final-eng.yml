name: Assert English edition QA

on:
  push:
    paths:
      - '.github/workflows/assert-book-final-eng.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert QA gate
        run: |
          set -e
          grep -Fq -- '- Numbered chapters: **36**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- Appendices: **7**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- Screen SVG: **43**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- Print SVG: **43**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- Missing image references: **0**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- High-signal Czech prose hits in English Markdown: **0**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- Possible Czech text labels inside SVG: **0**' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '- none' book_final_eng/ENGLISH_EDITION_QA.md
          grep -Fq -- '**PASS — international English manuscript is mechanically consistent and localized.**' book_final_eng/ENGLISH_EDITION_QA.md
      - name: Create pass marker
        run: |
          cat > book_final_eng/QA_PASS.md <<'EOF'
          # English Edition QA Gate

          **PASS — v0.8-eng manuscript structure, image references, metadata, and high-signal Czech-residue checks passed.**

          This gate is mechanical. It does not replace a later native copyedit, fresh snapshot fact-check immediately before publication, or physical proof of the final English typesetting.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final_eng/QA_PASS.md
          git commit -m "book: mark English edition QA pass"
          git push
