name: Final bilingual visual sync 2026-08-08

on:
  push:
    paths:
      - 'tools/final_visual_sync_2026_08_08.py'
      - '.github/workflows/final-visual-sync-2026-08-08.yml'

permissions:
  contents: write

jobs:
  visual-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install 'mistune==3.2.1' 'weasyprint==68.0' 'pymupdf==1.26.7' 'cairosvg==2.8.2' 'Pillow==12.3.0'
      - name: Reflow diagrams, QA, and rebuild both PDFs
        run: python tools/final_visual_sync_2026_08_08.py
      - name: Commit visually corrected assets and PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md book_final/assets/diagrams book_final/assets/diagrams-print book_final_eng/assets/diagrams book_final_eng/assets/diagrams-print \
            book_final/proof/AI-od-zakladu-k-agentnim-systemum-final-cz.pdf \
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-final-en.pdf \
            book_final/proof/FINAL_VISUAL_QA_2026-08-08.md \
            book_final_eng/proof/FINAL_VISUAL_QA_2026-08-08.md
          git commit -m 'book: sync final diagram cleanup into both release PDFs'
          git push
      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-bilingual-visual-sync-2026-08-08
          path: |
            book_final/proof/AI-od-zakladu-k-agentnim-systemum-final-cz.pdf
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-final-en.pdf
            book_final/proof/FINAL_VISUAL_QA_2026-08-08.md
            book_final_eng/proof/FINAL_VISUAL_QA_2026-08-08.md
            visual-contact-cs.jpg
            visual-contact-en.jpg
          if-no-files-found: error
