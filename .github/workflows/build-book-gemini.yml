name: Build book_gemini review variant

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_book_gemini.py'
      - '.github/workflows/build-book-gemini.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build review variant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_book_gemini.py')
          s = p.read_text(encoding='utf-8')
          old = 'if "[DOPLNIT]" in s or "TODO:" in s:'
          new = 'if not f.name.startswith(("FINAL_", "PREPRESS_")) and ("[DOPLNIT]" in s or "TODO:" in s):'
          if old not in s:
              raise SystemExit('placeholder guard marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/build_book_gemini.py

      - name: Commit book_gemini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_gemini
          if git diff --cached --quiet; then
            echo "No manuscript changes"
          else
            git commit -m "book: add Gemini review variant"
            git push
          fi
