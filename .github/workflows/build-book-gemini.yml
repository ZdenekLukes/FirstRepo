name: Build book_gemini review variant

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_book_gemini.py'
      - '.github/workflows/build-book-gemini.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build review variant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_book_gemini.py')
          s = p.read_text(encoding='utf-8')
          old = 'if "[DOPLNIT]" in s or "TODO:" in s:'
          new = 'if not f.name.startswith(("FINAL_", "PREPRESS_")) and ("[DOPLNIT]" in s or "TODO:" in s):'
          if old not in s:
              raise SystemExit('placeholder guard marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/build_book_gemini.py

      - name: Final review refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          def fix(rel, pairs):
              p = Path('book_gemini') / rel
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'marker not found in {rel}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          fix('22 - AI nad dokumenty a firemními daty.md', [
              ('„máme přístup k chatbota“', '„máme přístup k chatbotu“'),
              ('9. **Důležitý AI výstup má být verzovaný, citovaný a auditovatelný artifact.**',
               '9. **Permissioning musí filtrovat data před retrievalem a před vložením do kontextu modelu.**\n10. **Důležitý AI výstup má být verzovaný, citovaný a auditovatelný artifact.**')
          ])
          fix('09 - Prompting.md', [
              ('│ role, pravidla aplikace, bezpečnostní hranice│', '│ role, pravidla aplikace, bezpečnostní pravidla│')
          ])
          fix('16 - Co je AI agent.md', [
              ('databázová constraint,', 'databázové omezení,')
          ])
          fix('32 - Ekonomika AI.md', [
              ('**[Snapshot 08/2026 — ilustrativní model, nikoli ceník konkrétního poskytovatele.]**',
               '**[Snapshot 08/2026]** — Ilustrativní model, nikoli ceník konkrétního poskytovatele.')
          ])
          PY

      - name: Commit book_gemini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_gemini
          if git diff --cached --quiet; then
            echo "No manuscript changes"
          else
            git commit -m "book: finalize Gemini review variant"
            git push
          fi
