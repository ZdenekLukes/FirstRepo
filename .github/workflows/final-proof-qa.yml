name: Final proof QA

on:
  push:
    paths:
      - '.github/workflows/final-proof-qa.yml'
      - 'tools/final_proof_qa.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install --upgrade pymupdf
      - name: Run final proof QA
        run: python tools/final_proof_qa.py
      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/proof/FINAL_PROOF_QA.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add final proof QA report"
          git push
