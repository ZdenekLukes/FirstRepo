name: Apply English parity patch and rebuild PDF

on:
  push:
    paths:
      - '.github/workflows/apply-english-parity-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install 'mistune==3.2.1' 'weasyprint==68.0' 'pymupdf==1.26.7'
      - name: Apply surgical parity patch
        run: python tools/apply_english_parity_patch_2026_08_08.py
      - name: Run QA and rebuild English PDF
        run: python tools/build_english_parity_release_2026_08_08.py
      - name: Commit patched manuscript and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            'book_final_eng/13 - The Second Brain.md' \
            'book_final_eng/15 - MCP, Skills, Plugins, and Connectors.md' \
            'book_final_eng/18 - Multi-Agent Systems.md' \
            'book_final_eng/24 - AI Security.md' \
            'book_final_eng/33 - What I Have Learned So Far.md' \
            'book_final_eng/36 - Ten Projects from Beginner to Agentic Systems.md' \
            book_final_eng/FINAL_EDITORIAL_QA_2026-08-08.md \
            book_final_eng/CONTENT_PARITY_PATCH_2026-08-08.md \
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-final-en.pdf \
            book_final_eng/proof/FINAL_PDF_QA_2026-08-08.md
          git commit -m "book: apply English content parity patch and rebuild PDF"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: english-parity-final-pdf-2026-08-08
          path: |
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-final-en.pdf
            book_final_eng/FINAL_EDITORIAL_QA_2026-08-08.md
            book_final_eng/CONTENT_PARITY_PATCH_2026-08-08.md
            book_final_eng/proof/FINAL_PDF_QA_2026-08-08.md
          if-no-files-found: error
