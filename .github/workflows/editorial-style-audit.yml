name: Editorial style audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-style-audit.yml'
      - 'tools/editorial_style_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run editorial style audit
        run: python tools/editorial_style_audit.py
      - name: Commit style report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/EDITORIAL_STYLE_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add editorial style audit report"
          git push
