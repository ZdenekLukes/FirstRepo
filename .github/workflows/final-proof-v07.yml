name: Final editorial proof v0.7

on:
  push:
    paths:
      - '.github/workflows/final-proof-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare isolated v0.7 book workspace
        run: |
          rm -rf /tmp/book_original_v07
          mv book /tmp/book_original_v07
          cp -a book_final book
          python - <<'PY'
          from pathlib import Path

          # Adapt source prepress gate: 36 numbered chapters + separate 00 intro.
          p=Path('tools/prepress_audit.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("chapters=sorted([p for p in BOOK.glob('[0-9][0-9] - *.md') if p.name!='00 - INDEX.md'])", "chapters=sorted([p for p in BOOK.glob('[0-9][0-9] - *.md') if not p.name.startswith('00 -')])")
          s=s.replace("index_numbers=sorted(set(int(x) for x in re.findall(r'\\[\\[(\\d{2})\\s+-\\s+',index)))", "index_numbers=sorted({int(x) for x in re.findall(r'\\[\\[(\\d{2})\\s+-\\s+',index) if int(x) > 0})")
          s=s.replace("expected=list(range(1,38))", "expected=list(range(1,37))")
          s=s.replace("ch37=row_by.get('37 - Deset praktických projektů od začátečníka k agentnímu systému.md')", "ch37=row_by.get('36 - Deset praktických projektů od začátečníka k agentnímu systému.md')")
          s=s.replace('Kapitola 37 je stále příliš krátká', 'Kapitola 36 je stále příliš krátká')
          s=s.replace('Index neobsahuje přesně kapitoly 1–37.', 'Index neobsahuje přesně kapitoly 1–36.')
          p.write_text(s,encoding='utf-8')

          # Build a true v0.7 proof and use the final reader-facing subtitle.
          files=['tools/build_book_proof.py','tools/add_bibliography_to_proof.py','tools/refine_book_proof.py','tools/audit_book_proof.py','tools/final_proof_qa.py','tools/inspect_proof_small_fonts.py']
          for fn in files:
              p=Path(fn); s=p.read_text(encoding='utf-8').replace('v0.4','v0.7')
              p.write_text(s,encoding='utf-8')
          p=Path('tools/build_book_proof.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Co jsem se zatím naučil, jak AI chápu v srpnu 2026 a co mě ještě čeká','Jak AI skutečně funguje, jak ji používat a jak z modelů stavět spolehlivé systémy')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install proof dependencies
        run: python -m pip install --upgrade markdown weasyprint pymupdf pillow

      - name: Final source and prepress gates
        run: |
          python tools/final_copyedit_pass.py
          python tools/prepress_audit.py
          python tools/editorial_style_audit.py
          grep -q 'PASS — mechanické blockery' book/PREPRESS_AUTOMATED_AUDIT.md
          grep -q 'Screen SVG: **43**' book/PREPRESS_AUTOMATED_AUDIT.md
          grep -q 'Print SVG: **43**' book/PREPRESS_AUTOMATED_AUDIT.md

      - name: Build and audit proof
        run: |
          python tools/build_book_proof.py
          python tools/add_bibliography_to_proof.py
          python tools/refine_book_proof.py
          python tools/audit_book_proof.py
          python tools/final_proof_qa.py
          python tools/inspect_proof_small_fonts.py
          grep -q 'Automated proof gate: PASS' book/proof/PROOF_AUDIT.md
          grep -q 'Automated layout gate: PASS' book/proof/FINAL_PROOF_QA.md

      - name: Restore historical book and preserve v0.7 outputs
        run: |
          rm -rf book_final
          cp -a book book_final
          rm -rf book
          mv /tmp/book_original_v07 book
          git checkout -- README.md tools/prepress_audit.py tools/build_book_proof.py tools/add_bibliography_to_proof.py tools/refine_book_proof.py tools/audit_book_proof.py tools/final_proof_qa.py tools/inspect_proof_small_fonts.py

      - name: Commit proof v0.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "book: build final print-candidate proof v0.7"
          git push
