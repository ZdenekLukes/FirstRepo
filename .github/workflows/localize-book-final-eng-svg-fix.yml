name: Localize English SVGs pass 2

on:
  push:
    paths:
      - '.github/workflows/localize-book-final-eng-svg-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply translation map and repair partial replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re, html
          src=Path('.github/workflows/localize-book-final-eng-svg.yml').read_text(encoding='utf-8')
          a=src.index('pairs = [') + len('pairs = ')
          b=src.index('\n          ]', a) + len('\n          ]')
          pairs=ast.literal_eval(src[a:b])
          pairs += [
            ('reálná task','real task'),
            ('jedna přesná task','one precise task'),
            ('vícevrstvé neural networks','deep neural networks'),
            ('Agent je software kolem LLM: goal, stav, nástroje, kontroly a smyčka.','An agent is software around an LLM: goal, state, tools, controls, and a loop.'),
            ('Pět trendů: adaptivní reasoning, multimodalita, levnější inference, nástroje a agentní workflow, vše směřuje k ověřenému AI systemu.','Five trends — adaptive reasoning, multimodality, cheaper inference, tools, and agentic workflows — converge on verified AI systems.')
          ]
          roots=[Path('book_final_eng/assets/diagrams'),Path('book_final_eng/assets/diagrams-print')]
          changed=0
          for root in roots:
            for p in root.glob('*.svg'):
              s=p.read_text(encoding='utf-8'); orig=s
              for old,new in pairs: s=s.replace(old,new)
              if s!=orig:
                p.write_text(s,encoding='utf-8'); changed+=1
          print('changed',changed)
          # Conservative gate: Czech diacritics or high-signal Czech lexical residue in visible SVG text.
          cz=re.compile(r'\b(jsou|když|který|nástroj|nástroje|modelu|proč|při|správn\w*|systém\w*|úloha|výsledek|vrstva|zdroj|žádn\w*|cíl|stav|smyčka|požadavky|návrh|porovnání|lidé|měřit|sdílet|trénovat)\b',re.I)
          suspects=[]
          for root in roots:
            for p in root.glob('*.svg'):
              s=p.read_text(encoding='utf-8')
              texts=re.findall(r'<(?:text|title|desc)(?:\s[^>]*)?>(.*?)</(?:text|title|desc)>',s,re.S)
              texts=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in texts]
              bad=[x for x in texts if x and (re.search(r'[áčďéěíňóřšťúůýžÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]',x) or cz.search(x))]
              if bad: suspects.append((str(p),bad))
          if suspects:
            for p,b in suspects: print(p,b)
            raise SystemExit(f'Czech residue remains in {len(suspects)} SVGs')
          assert sum(1 for _ in roots[0].glob('*.svg')) == 43
          assert sum(1 for _ in roots[1].glob('*.svg')) == 43
          PY
      - name: Commit localized diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final_eng/assets
          git commit -m "book: localize English edition diagrams"
          git push
