name: Dump English SVG labels

on:
  push:
    paths:
      - '.github/workflows/dump-book-final-eng-svg-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract every visible SVG label
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html
          root=Path('book_final_eng/assets/diagrams')
          out=['# All visible screen-SVG labels','']
          unique=[]
          seen=set()
          for p in sorted(root.glob('*.svg')):
            s=p.read_text(encoding='utf-8')
            texts=re.findall(r'<(?:text|title|desc)(?:\s[^>]*)?>(.*?)</(?:text|title|desc)>',s,re.S)
            texts=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in texts]
            texts=[x for x in texts if x]
            out += [f'## {p.name}','']
            for x in texts:
              out.append(f'- {x}')
              if x not in seen:
                seen.add(x); unique.append(x)
            out.append('')
          out += ['# Unique labels',''] + [f'- {x}' for x in unique]
          Path('book_final_eng/SVG_ALL_LABELS.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('files',len(list(root.glob('*.svg'))),'unique labels',len(unique))
          PY
      - name: Commit label dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final_eng/SVG_ALL_LABELS.md
          git commit -m "book: dump English SVG labels"
          git push
