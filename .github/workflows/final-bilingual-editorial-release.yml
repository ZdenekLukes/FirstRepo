name: Final bilingual editorial release

on:
  push:
    paths:
      - '.github/workflows/final-bilingual-editorial-release.yml'
      - 'tools/final_editorial_release_2026_08_08.py'
      - 'tools/final_bilingual_qa_build_2026_08_08.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install 'mistune==3.2.1' 'weasyprint==68.0' 'pymupdf==1.26.7'
      - name: Apply final bilingual editorial corrections
        run: python tools/final_editorial_release_2026_08_08.py
      - name: Run final manuscript QA and build both PDFs
        run: python tools/final_bilingual_qa_build_2026_08_08.py
      - name: Commit release-candidate manuscripts and proofs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final book_final_eng
          git commit -m "book: final editorial pass and bilingual PDF release candidates"
          git push
      - name: Upload final bilingual PDFs
        uses: actions/upload-artifact@v4
        with:
          name: final-bilingual-book-pdfs-2026-08-08
          path: |
            book_final/proof/AI-od-zakladu-k-agentnim-systemum-final-cz.pdf
            book_final/proof/FINAL_PDF_QA_2026-08-08.md
            book_final/FINAL_EDITORIAL_QA_2026-08-08.md
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-final-en.pdf
            book_final_eng/proof/FINAL_PDF_QA_2026-08-08.md
            book_final_eng/FINAL_EDITORIAL_QA_2026-08-08.md
          if-no-files-found: error
