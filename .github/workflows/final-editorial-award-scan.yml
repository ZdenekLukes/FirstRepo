name: Final editorial award scan

on:
  push:
    paths:
      - 'tools/final_editorial_award_scan.py'
      - '.github/workflows/final-editorial-award-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan manuscript
        run: python tools/final_editorial_award_scan.py
      - name: Commit raw scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final/FINAL_EDITORIAL_SCAN_RAW.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add final editorial scan"
          git push
