name: Build and audit English proof

on:
  push:
    paths:
      - '.github/workflows/verify-book-final-eng-svg-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install --upgrade markdown weasyprint pymupdf pillow
      - name: Create English proof builder
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('tools/build_book_proof.py').read_text(encoding='utf-8')
          src=src.replace("BOOK = ROOT / 'book'", "BOOK = ROOT / 'book_final_eng'")
          src=src.replace("appendices = sorted((BOOK / 'appendices').glob('*.md'))", "appendices = sorted((BOOK / 'appendices').glob('*.md')) + [BOOK / 'BIBLIOGRAPHY.md']")
          src=src.replace('<html lang="cs"><head><meta charset="utf-8"><title>AI od základů k agentním systémům - proof v0.4</title>', '<html lang="en"><head><meta charset="utf-8"><title>AI: From First Principles to Agentic Systems — proof v0.8-eng</title>')
          src=src.replace('<h1>AI od základů k agentním systémům</h1>', '<h1>AI: From First Principles to Agentic Systems</h1>')
          src=src.replace('<div class="subtitle">Co jsem se zatím naučil, jak AI chápu v srpnu 2026 a co mě ještě čeká</div>', '<div class="subtitle">How AI Actually Works — From LLMs and RAG to Tools, Agents, Evals, and Reliable Systems</div>')
          src=src.replace('<div class="meta">Proof v0.4 · 7. 8. 2026 · pracovní předtisková sazba 170 × 240 mm</div>', '<div class="meta">English proof v0.8-eng · August 8, 2026 · 170 × 240 mm technical-book layout</div>')
          src=src.replace('<section class="toc"><h1>Obsah</h1>', '<section class="toc"><h1>Contents</h1>')
          src=src.replace("html_path = OUT / 'AI-book-proof-v0.4.html'", "html_path = OUT / 'AI-From-First-Principles-to-Agentic-Systems-proof-v0.8-eng.html'")
          src=src.replace("pdf_path = OUT / 'AI-book-proof-v0.4.pdf'", "pdf_path = OUT / 'AI-From-First-Principles-to-Agentic-Systems-proof-v0.8-eng.pdf'")
          src=src.replace('body { font-size: 9.7pt; line-height: 1.43; margin: 0; }', 'body { font-size: 9.7pt; line-height: 1.43; margin: 0; hyphens: auto; }')
          Path('tools/build_book_final_eng_tmp.py').write_text(src,encoding='utf-8')
          PY
      - name: Build English proof
        run: python tools/build_book_final_eng_tmp.py
      - name: Audit and render representative pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          proof=Path('book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-proof-v0.8-eng.pdf')
          doc=fitz.open(proof)
          blockers=[]; warnings=[]
          expected_w=170/25.4*72; expected_h=240/25.4*72
          page_sizes=[]; blank=[]; min_font=999; out_blocks=[]
          all_text=[]
          starts={}
          targets=['A Century of AI in One Chapter','RAG','Anatomy and Loop of an AI Agent','Case Study','The Economics of AI','Ten Projects from Beginner to Agentic Systems','Sources, Primary Documentation, and Further Reading']
          for i,page in enumerate(doc):
              r=page.rect
              page_sizes.append((r.width,r.height))
              if abs(r.width-expected_w)>1.5 or abs(r.height-expected_h)>1.5:
                  blockers.append(f'Page {i+1}: unexpected size {r.width:.1f}×{r.height:.1f} pt')
              text=page.get_text('text')
              all_text.append(text)
              if len(text.strip())<15 and not page.get_images(full=True): blank.append(i+1)
              d=page.get_text('dict')
              for b in d.get('blocks',[]):
                  x0,y0,x1,y1=b.get('bbox',(0,0,0,0))
                  if x0 < -1 or y0 < -1 or x1 > r.width+1 or y1 > r.height+1:
                      out_blocks.append((i+1,(x0,y0,x1,y1)))
                  for line in b.get('lines',[]):
                      for span in line.get('spans',[]):
                          size=span.get('size',999)
                          if span.get('text','').strip(): min_font=min(min_font,size)
              for t in targets:
                  if t not in starts and t.lower() in text.lower(): starts[t]=i
          joined='\n'.join(all_text)
          if 'AI: From First Principles to Agentic Systems' not in all_text[0]: blockers.append('English title missing from first page.')
          if 'How AI Actually Works' not in all_text[0]: blockers.append('English subtitle missing from first page.')
          for bad in ['AI od základů k agentním systémům','Co jsem se zatím naučil','Processs']:
              if bad in joined: blockers.append(f'Forbidden/stale text found in PDF: {bad}')
          if blank: warnings.append(f'Possible blank pages: {blank[:30]}')
          if out_blocks: blockers.append(f'Text/image blocks outside page bounds: {out_blocks[:20]}')
          if min_font < 6.8: blockers.append(f'Minimum extracted font size {min_font:.2f} pt is below 6.8 pt gate.')
          if len(doc)<250: warnings.append(f'Proof is shorter than expected for this layout: {len(doc)} pages.')
          words=len(re.findall(r"\b[A-Za-z0-9][A-Za-z0-9'’\-]*\b",joined))
          if words<45000: blockers.append(f'Extracted word count looks too low: {words:,}')

          preview=Path('book_final_eng/proof/preview'); preview.mkdir(parents=True,exist_ok=True)
          pages={0,1,max(0,len(doc)//2),len(doc)-1}
          pages.update(starts.values())
          rendered=[]
          for i in sorted(x for x in pages if 0<=x<len(doc)):
              pix=doc[i].get_pixmap(matrix=fitz.Matrix(1.7,1.7),alpha=False)
              name=f'page-{i+1:04d}.png'
              pix.save(preview/name)
              rendered.append(i+1)

          report=[
              '# English Proof QA — 2026-08-08','',
              f'- PDF: `{proof.name}`',
              f'- Pages: **{len(doc)}**',
              f'- Extracted words: **{words:,}**',
              f'- Minimum extracted font size: **{min_font:.2f} pt**',
              f'- Possible blank pages: **{len(blank)}**',
              f'- Out-of-bounds blocks: **{len(out_blocks)}**',
              f'- Representative pages rendered: **{rendered}**','',
              '## Chapter/page anchors',''
          ]
          report += [f'- {k}: page **{v+1}**' for k,v in starts.items()]
          report += ['','## Blockers',''] + (['- none'] if not blockers else [f'- {x}' for x in blockers])
          report += ['','## Warnings',''] + (['- none'] if not warnings else [f'- {x}' for x in warnings])
          report += ['','## Gate','', '**PASS — automated English proof gates passed.**' if not blockers else '**FAIL — proof blockers remain.**','']
          Path('book_final_eng/proof/ENGLISH_PROOF_QA.md').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Enforce automated proof gate
        run: grep -Fq '**PASS — automated English proof gates passed.**' book_final_eng/proof/ENGLISH_PROOF_QA.md
      - name: Commit English proof
        run: |
          rm -f tools/build_book_final_eng_tmp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book_final_eng/proof
          git commit -m "book: build English proof v0.8-eng"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: English-book-proof-v0.8-eng
          path: |
            book_final_eng/proof/AI-From-First-Principles-to-Agentic-Systems-proof-v0.8-eng.pdf
            book_final_eng/proof/ENGLISH_PROOF_QA.md
            book_final_eng/proof/preview/*.png
