              orig=s
              for a,b in pairs:
                s=s.replace(a,b)
              if s != orig:
                p.write_text(s,encoding='utf-8')
                changed += 1
          print('changed SVG files', changed)
          # hard check: no Czech diacritics should remain in textual SVG content
          import re, html
          suspects=[]
          cz_words=re.compile(r'\b(ale|bez|co|do|je|jsou|jak|když|který|modelu|nástroj|nástroje|od|pro|proč|při|správn\w*|systém\w*|úloha|výsledek|vrstva|zdroj|žádn\w*)\b',re.I)
          for root in roots:
            for p in root.glob('*.svg'):
              s=p.read_text(encoding='utf-8')
              texts=re.findall(r'<(?:text|title|desc)(?:\s[^>]*)?>(.*?)</(?:text|title|desc)>',s,re.S)
              texts=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in texts]
